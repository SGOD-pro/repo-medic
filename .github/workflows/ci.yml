name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'Component to run CI/CD for'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - frontend
          - backend

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repomedic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.resolve.outputs.backend }}
      frontend: ${{ steps.resolve.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'fixtures/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
      - name: Resolve target components
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ inputs.target }}"
            case "$TARGET" in
              frontend)
                echo "backend=false" >> "$GITHUB_OUTPUT"
                echo "frontend=true" >> "$GITHUB_OUTPUT"
                ;;
              backend)
                echo "backend=true" >> "$GITHUB_OUTPUT"
                echo "frontend=false" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "backend=true" >> "$GITHUB_OUTPUT"
                echo "frontend=true" >> "$GITHUB_OUTPUT"
                ;;
            esac
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
            echo "frontend=${{ steps.filter.outputs.frontend }}" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend checks and SAM build
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      NEBIUS_API_KEY: ${{ secrets.NEBIUS_API_KEY }}
      NEBIUS_PROJECT_ID: ${{ secrets.NEBIUS_PROJECT_ID }}
      TOKEN_FACTORY_API_KEY: ${{ secrets.TOKEN_FACTORY_API_KEY || secrets.NEBIUS_API_KEY }}
      TOKEN_FACTORY_SANDBOX_PROJECT_ID: ${{ secrets.NEBIUS_PROJECT_ID }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Configure git identity for tests
        run: |
          git config --global user.name "RepoMedic CI"
          git config --global user.email "ci@repo-medic.local"
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
      - run: uv run pytest
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam validate --lint
      - run: sam build --use-container

  frontend:
    name: Frontend checks and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_TRANSPORT: http
          NEXT_PUBLIC_API_URL: /api

  deploy_backend:
    name: Deploy existing AWS SAM stack
    needs: [changes, backend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Confirm existing stack
        run: aws cloudformation describe-stacks --stack-name repo-medic --region ap-south-1 --query 'Stacks[0].StackName' --output text
      - run: sam build --use-container
      - name: Deploy without overriding runtime credentials
        run: >-
          sam deploy --config-file "$GITHUB_WORKSPACE/backend/samconfig.ci.toml"
          --stack-name repo-medic --region ap-south-1
          --resolve-s3 --capabilities CAPABILITY_IAM
          --no-confirm-changeset --no-fail-on-empty-changeset

  deploy_frontend:
    name: Deploy frontend to Vercel
    needs: [changes, frontend]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull production settings
        run: vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
      - name: Build production deployment
        run: vercel build --prod --token "$VERCEL_TOKEN"
      - name: Publish production deployment
        run: vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
