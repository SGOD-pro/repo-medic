name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Lint and Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Run code lint check
        run: uv run flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit test suite
        run: uv run pytest
        # Note: REPOMEDIC_RUN_LIVE_PROVIDERS is omitted here, keeping paid provider tests strictly opt in

  frontend:
    name: Frontend Lint Typecheck Tests and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_TRANSPORT: http
          NEXT_PUBLIC_API_URL: /api

  sam:
    name: SAM Validate and Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate SAM template
        run: sam validate --lint

      - name: Build SAM application
        run: sam build

  deploy:
    name: Deploy to AWS SAM
    runs-on: ubuntu-latest
    needs: [sam]
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials via OIDC
        if: "${{ secrets.AWS_ROLE_TO_ASSUME != '' }}"
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Build SAM application with container
        if: "${{ secrets.AWS_ROLE_TO_ASSUME != '' }}"
        run: sam build --use-container

      - name: Deploy SAM application
        if: "${{ secrets.AWS_ROLE_TO_ASSUME != '' }}"
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --stack-name repomedic-production \
            --parameter-overrides \
              Environment=production \
              AppOrigin="${{ secrets.REPOMEDIC_APP_ORIGIN || 'https://repo-medic.vercel.app' }}" \
              TursoDatabaseUrl="${{ secrets.TURSO_DATABASE_URL }}" \
              TursoAuthToken="${{ secrets.TURSO_AUTH_TOKEN }}" \
              TokenFactoryApiKey="${{ secrets.TOKEN_FACTORY_API_KEY }}" \
              NebiusApiKey="${{ secrets.NEBIUS_API_KEY }}" \
              NebiusProjectId="${{ secrets.NEBIUS_PROJECT_ID }}"

